<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Horizontal Nested Squares</title>
  <style>
    body {
      margin: 40px;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    .main-row {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .outer-box {
      width: 200px;
      height: 200px;
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .inner-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .inner-box {
      flex: 1;
      height: 80px;
      background-color: #90caf9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0d47a1;
    }
  </style>
</head>
<body>

  <div class="main-row">
    <div class="outer-box">
      <div class="inner-row">
        <div class="inner-box">1.1</div>
        <div class="inner-box">1.2</div>
      </div>
      <div class="inner-row">
        <div class="inner-box">1.3</div>
      </div>
    </div>

    <div class="outer-box">
      <div class="inner-row">
        <div class="inner-box">2.1</div>
        <div class="inner-box">2.2</div>
        <div class="inner-box">2.3</div>
      </div>
    </div>

    <div class="outer-box">
      <div class="inner-row">
        <div class="inner-box">3.1</div>
        <div class="inner-box">3.2</div>
      </div>
      <div class="inner-row">
        <div class="inner-box">3.3</div>
      </div>
    </div>
  </div>

</body>
</html>
